services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ksp
      POSTGRES_PASSWORD: ksp
      POSTGRES_DB: ksp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksp"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://ksp:ksp@db:5432/ksp
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
